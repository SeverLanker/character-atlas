name: Build Windows desktop
on:
  workflow_dispatch:
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npx tsc -b
      - name: Test domain, backup and storage
        run: npm test
      - name: Build Windows installer
        run: npm run desktop:build
      - name: Test native local storage
        run: cargo test --manifest-path src-tauri/Cargo.toml --release --locked --lib
      - uses: actions/upload-artifact@v4
        with:
          name: Character-Atlas-Windows
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
